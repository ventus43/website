<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>벤투스 참여 페이지 모음</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <meta property="og:title" content="벤투스 참여 페이지 모음">
  <meta property="og:description" content="설문조사 · 씨앗책방 · 힐링 유형 테스트">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#8BBDE8;
      --accent-strong:#62A2E2;
      --peach:#E6A893;
      --ink:#fff;
      --ink-soft:rgba(255,255,255,.66);
      --ink-faint:rgba(255,255,255,.4);
      --card:rgba(255,255,255,.07);
      --card-line:rgba(255,255,255,.14);
    }
    html,body{height:100%}
    body{
      font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      color:var(--ink);
      background:#0A3680;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
    #fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block;pointer-events:none}

    .wrap{
      position:relative;z-index:1;
      min-height:100dvh;
      display:flex;flex-direction:column;justify-content:center;
      max-width:480px;margin:0 auto;
      padding:56px 22px calc(56px + env(safe-area-inset-bottom));
    }

    .eyebrow{
      font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;
      color:var(--accent);
      display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;
    }
    .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
    h1{font-size:29px;line-height:1.4;font-weight:800;letter-spacing:-.02em}
    .lead{margin-top:14px;font-size:14px;line-height:1.7;color:var(--ink-soft)}

    .cards{margin-top:34px;display:flex;flex-direction:column;gap:14px}
    .card{
      position:relative;display:block;
      background:var(--card);
      border:1px solid var(--card-line);
      border-radius:20px;
      padding:22px 20px;
      color:inherit;text-decoration:none;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      transition:transform .16s ease,border-color .2s ease,background .2s ease;
      overflow:hidden;
    }
    .card::after{
      content:"→";
      position:absolute;right:20px;top:50%;transform:translateY(-50%);
      font-size:18px;color:var(--ink-faint);
      transition:color .2s ease,transform .2s ease;
    }
    .card:hover,.card:focus-visible{
      transform:translateY(-2px);
      border-color:rgba(139,189,232,.55);
      background:rgba(139,189,232,.12);
      outline:none;
    }
    .card:hover::after,.card:focus-visible::after{color:var(--accent);transform:translateY(-50%) translateX(3px)}
    .card:active{transform:translateY(0) scale(.99)}

    .card-icon{
      width:44px;height:44px;border-radius:13px;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;margin-bottom:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--card-line);
    }
    .card-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
    .card-desc{margin-top:6px;font-size:13px;line-height:1.6;color:var(--ink-soft);padding-right:24px}
    .card-tag{
      display:inline-block;margin-top:12px;
      font-size:11px;font-weight:700;letter-spacing:.04em;
      color:var(--accent);background:rgba(139,189,232,.14);
      border-radius:999px;padding:5px 11px;
    }

    footer{margin-top:30px;text-align:center;font-size:11px;letter-spacing:.1em;color:var(--ink-faint)}

    @media (max-height:720px){
      .wrap{justify-content:flex-start}
      h1{font-size:25px}
      .cards{margin-top:24px}
      .card{padding:18px}
    }
  </style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<main class="wrap">
  <div class="eyebrow">Ventus</div>
  <h1>지금 참여할 수 있는<br>페이지를 골라보세요</h1>
  <p class="lead">아래에서 원하는 항목을 눌러 이동할 수 있어요.</p>

  <nav class="cards">
    <a class="card" href="/survey" data-accent="#8BBDE8">
      <div class="card-icon">🎟️</div>
      <div class="card-title">문화티켓 설문조사</div>
      <div class="card-desc">문화티켓 월구독권 서비스 기획을 위한 3문항 설문 · 약 30초</div>
      <span class="card-tag">설문 참여</span>
    </a>

    <a class="card" href="/seedsbook" data-accent="#9FD8B4">
      <div class="card-icon">🌱</div>
      <div class="card-title">씨앗책방</div>
      <div class="card-desc">마음에 드는 캐릭터에 투표하고, 독서 취향 설문에 참여해요</div>
      <span class="card-tag">투표 + 설문</span>
    </a>

    <a class="card" href="/healing-type" data-accent="#E6A893">
      <div class="card-icon">🫧</div>
      <div class="card-title">힐링 유형 테스트</div>
      <div class="card-desc">9개의 YES/NO 질문으로 알아보는 나만의 회복법 · 약 40초</div>
      <span class="card-tag">유형 테스트</span>
    </a>
  </nav>

  <footer>VENTUS · 2026</footer>
</main>

<script>
(function () {
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  /* ---------- 배경 오브 ---------- */
  var BG = {
    c: document.getElementById('bg'), ctx: null, w: 0, h: 0, t: 0,
    px: 0, py: 0, tpx: 0, tpy: 0, orbs: [],
    pal: [[98,162,226],[139,189,232],[230,168,147],[120,150,225],[86,196,206]],
    init: function () {
      this.ctx = this.c.getContext('2d');
      this.resize(); window.addEventListener('resize', this.resize.bind(this));
      for (var i = 0; i < 5; i++) this.orbs.push({
        x: Math.random(), y: Math.random(), r: 0.30 + Math.random() * 0.34,
        col: this.pal[i % this.pal.length],
        sx: (Math.random() - 0.5) * 0.00013, sy: (Math.random() - 0.5) * 0.00013,
        ph: Math.random() * Math.PI * 2
      });
      window.addEventListener('pointermove', function (e) {
        this.tpx = (e.clientX / window.innerWidth - 0.5) * 2;
        this.tpy = (e.clientY / window.innerHeight - 0.5) * 2;
      }.bind(this), { passive: true });
      requestAnimationFrame(this.loop.bind(this));
    },
    resize: function () {
      this.w = this.c.width = window.innerWidth * DPR;
      this.h = this.c.height = window.innerHeight * DPR;
      this.c.style.width = window.innerWidth + 'px';
      this.c.style.height = window.innerHeight + 'px';
    },
    loop: function () {
      this.t++;
      this.px += (this.tpx - this.px) * 0.04;
      this.py += (this.tpy - this.py) * 0.04;
      var ctx = this.ctx, W = this.w, H = this.h;
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0A3680'); g.addColorStop(1, '#07265E');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < this.orbs.length; i++) {
        var o = this.orbs[i];
        o.x += o.sx; o.y += o.sy;
        if (o.x < -0.3 || o.x > 1.3) o.sx *= -1;
        if (o.y < -0.3 || o.y > 1.3) o.sy *= -1;
        var pulse = 0.85 + Math.sin(this.t * 0.006 + o.ph) * 0.15;
        var cx = o.x * W + this.px * 44 * DPR * (i % 2 ? 1 : -1);
        var cy = o.y * H + this.py * 44 * DPR * (i % 2 ? -1 : 1);
        var rad = o.r * Math.min(W, H) * pulse;
        var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        rg.addColorStop(0, 'rgba(' + o.col[0] + ',' + o.col[1] + ',' + o.col[2] + ',0.20)');
        rg.addColorStop(1, 'rgba(' + o.col[0] + ',' + o.col[1] + ',' + o.col[2] + ',0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(this.loop.bind(this));
    }
  };

  /* ---------- 탭 파티클 + 이동 트랜지션 ---------- */
  var FX = {
    c: document.getElementById('fx'), ctx: null, w: 0, h: 0,
    parts: [], rings: [], running: false,
    init: function () {
      this.ctx = this.c.getContext('2d');
      this.resize(); window.addEventListener('resize', this.resize.bind(this));
    },
    resize: function () {
      this.w = this.c.width = window.innerWidth * DPR;
      this.h = this.c.height = window.innerHeight * DPR;
      this.c.style.width = window.innerWidth + 'px';
      this.c.style.height = window.innerHeight + 'px';
    },
    hexRGB: function (hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    },
    burst: function (x, y, hex) {
      var px = x * DPR, py = y * DPR, col = this.hexRGB(hex || '#8BBDE8');
      for (var i = 0; i < 22; i++) {
        var ang = Math.random() * Math.PI * 2;
        var sp = 2.4 * (0.35 + Math.random()) * DPR;
        this.parts.push({
          x: px, y: py, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.5 * DPR,
          life: 1, decay: 0.016 + Math.random() * 0.02,
          r: 3.2 * (0.6 + Math.random()) * DPR,
          col: (i % 4 === 0) ? [255, 255, 255] : col
        });
      }
      this.rings.push({ x: px, y: py, r: 6 * DPR, vr: 3.6 * DPR, life: 1, col: col });
      this.kick();
    },
    kick: function () {
      if (!this.running) { this.running = true; requestAnimationFrame(this.loop.bind(this)); }
    },
    loop: function () {
      var ctx = this.ctx;
      ctx.clearRect(0, 0, this.w, this.h);
      for (var i = this.parts.length - 1; i >= 0; i--) {
        var p = this.parts[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.03 * DPR;
        p.vx *= 0.99; p.vy *= 0.99; p.life -= p.decay;
        if (p.life <= 0) { this.parts.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = 'rgb(' + p.col[0] + ',' + p.col[1] + ',' + p.col[2] + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      }
      for (var j = this.rings.length - 1; j >= 0; j--) {
        var r = this.rings[j];
        r.r += r.vr; r.vr *= 0.96; r.life -= 0.03;
        if (r.life <= 0) { this.rings.splice(j, 1); continue; }
        ctx.globalAlpha = Math.max(0, r.life) * 0.6;
        ctx.strokeStyle = 'rgb(' + r.col[0] + ',' + r.col[1] + ',' + r.col[2] + ')';
        ctx.lineWidth = 2 * DPR;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (this.parts.length || this.rings.length) requestAnimationFrame(this.loop.bind(this));
      else this.running = false;
    }
  };

  BG.init(); FX.init();

  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('click', function (e) {
      e.preventDefault();
      var href = card.getAttribute('href');
      var accent = card.getAttribute('data-accent') || '#8BBDE8';
      var b = card.getBoundingClientRect();
      var x = e.clientX || (b.left + b.width / 2);
      var y = e.clientY || (b.top + b.height / 2);
      FX.burst(x, y, accent);
      document.querySelector('.wrap').style.transition = 'opacity .32s ease, transform .32s ease';
      document.querySelector('.wrap').style.opacity = '0';
      document.querySelector('.wrap').style.transform = 'translateY(-8px)';
      setTimeout(function () { window.location.href = href; }, 300);
    });
  });
})();
</script>
</body>
</html>
