name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GVENTUS }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

      - name: Ensure directories exist
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/report/dist /home/ubuntu/report/api /home/ubuntu/report/nginx"

      - name: Deploy static files
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.idea/' \
            --exclude '.DS_Store' \
            --exclude 'README.md' \
            --exclude '.github/' \
            --exclude 'api/' \
            --exclude 'nginx/' \
            -e "ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/report/dist/

      - name: Deploy API server
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./api/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/report/api/

      - name: Install dependencies & restart API
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
          cd /home/ubuntu/report/api
          npm install --omit=dev

          # PM2 글로벌 설치 (sudo 필요)
          if ! command -v pm2 &> /dev/null; then
            sudo npm install -g pm2
            # 서버 재시작 후 자동 실행 등록
            sudo env PATH=$PATH:/usr/local/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu
          fi

          # 실행 중이면 reload, 아니면 start
          if pm2 list | grep -q "gventus-api"; then
            pm2 reload gventus-api
          else
            pm2 start server.js --name gventus-api
          fi

          pm2 save
          ENDSSH

      - name: Deploy & apply Nginx config
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./nginx/gventus ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/report/nginx/gventus
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} \
            "sudo cp /home/ubuntu/report/nginx/gventus /etc/nginx/sites-available/gventus \
             && sudo nginx -t \
             && sudo systemctl reload nginx"
